[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Заголовки безпеки (статичні файли; для SSR — server/middleware/security-headers.ts,
# значення в scripts/security-headers.mjs, мають збігатися). 'unsafe-inline' для script-src потрібен, бо SSR вставляє
# інлайн-скрипти гідрації (різні на кожен запит) і два скрипти в <head>.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://grok.com https://challenges.cloudflare.com https://accounts.google.com https://apis.google.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://challenges.cloudflare.com https://accounts.google.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.google.com; frame-src https://challenges.cloudflare.com https://accounts.google.com https://www.google.com https://*.firebaseapp.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
