<!doctype html>
<!-- Шаблон прев’ю посилання на запуск (1200×630). Рендер: node scripts/og/render.mjs → public/og-launch.png -->
<html lang="uk"><head><meta charset="utf-8"><style>
@font-face { font-family: M; font-weight: 700; src: url(../../node_modules/@fontsource-variable/manrope/files/manrope-cyrillic-wght-normal.woff2); }
@font-face { font-family: M; font-weight: 800; src: url(../../node_modules/@fontsource-variable/manrope/files/manrope-cyrillic-wght-normal.woff2); }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #05060a; font-family: M, sans-serif; }
.bg { position: absolute; inset: 0; background: radial-gradient(60% 80% at 78% 40%, rgba(139,123,255,.35), transparent 60%), radial-gradient(50% 70% at 10% 100%, rgba(242,196,109,.18), transparent 60%), #05060a; }
svg { position: absolute; inset: 0; }
.txt { position: absolute; left: 80px; top: 96px; width: 600px; color: #f2f1ec; }
.k { color: #f2c46d; font-weight: 700; font-size: 28px; letter-spacing: .12em; text-transform: uppercase; }
h1 { margin: 22px 0 18px; font-weight: 800; font-size: 84px; line-height: 1.02; letter-spacing: -.02em; }
p { margin: 0; color: #b9bccb; font-weight: 700; font-size: 32px; line-height: 1.35; }
.brand { position: absolute; left: 80px; bottom: 64px; display: flex; align-items: center; gap: 14px; color: #f2f1ec; font-weight: 800; font-size: 34px; }
.brand i { width: 18px; height: 18px; border-radius: 50%; background: #f2c46d; box-shadow: 0 0 24px #f2c46d; }
</style></head><body>
<div class="bg"></div>
<svg width="1200" height="630" viewBox="0 0 1200 630" id="sky"></svg>
<div class="txt"><div class="k">Запуск орбіти</div><h1>Підтверди<br>мій запуск ✦</h1><p>8 людей · 24 години заряду.<br>Код уже в посиланні.</p></div>
<div class="brand"><i></i>Орбіти · запускаємо разом</div>
<script>
const s = document.getElementById("sky"); const ns = "http://www.w3.org/2000/svg"; let seed = 7;
const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 140; i++) { const c = document.createElementNS(ns, "circle"); c.setAttribute("cx", r() * 1200); c.setAttribute("cy", r() * 630); c.setAttribute("r", r() * 1.6 + .3); c.setAttribute("fill", `rgba(255,255,255,${(r() * .6 + .2).toFixed(2)})`); s.appendChild(c); }
const cx = 915, cy = 315;
for (const [rx, ry, o] of [[230, 230, .25], [170, 170, .35], [110, 110, .5]]) { const e = document.createElementNS(ns, "ellipse"); e.setAttribute("cx", cx); e.setAttribute("cy", cy); e.setAttribute("rx", rx); e.setAttribute("ry", ry); e.setAttribute("fill", "none"); e.setAttribute("stroke", `rgba(242,196,109,${o})`); e.setAttribute("stroke-width", 2); s.appendChild(e); }
const g = document.createElementNS(ns, "radialGradient"); g.id = "p"; g.innerHTML = '<stop offset="0" stop-color="#fff6dd"/><stop offset=".55" stop-color="#f2c46d"/><stop offset="1" stop-color="#b8862f"/>'; const d = document.createElementNS(ns, "defs"); d.appendChild(g); s.appendChild(d);
const pl = document.createElementNS(ns, "circle"); pl.setAttribute("cx", cx); pl.setAttribute("cy", cy); pl.setAttribute("r", 62); pl.setAttribute("fill", "url(#p)"); s.appendChild(pl);
for (let i = 0; i < 8; i++) { const a = (-90 + i * 45) * Math.PI / 180; const c = document.createElementNS(ns, "circle"); c.setAttribute("cx", cx + 170 * Math.cos(a)); c.setAttribute("cy", cy + 170 * Math.sin(a)); c.setAttribute("r", 13); c.setAttribute("fill", i < 3 ? "#f2c46d" : "#2a3048"); c.setAttribute("stroke", i < 3 ? "#fff3cf" : "#4a5272"); c.setAttribute("stroke-width", 3); s.appendChild(c); }
</script></body></html>
